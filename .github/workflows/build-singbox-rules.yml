name: Build platform rules

on:
  push:
    branches: [main]
    paths:
      - selfdirect.list
      - special.list
      - scripts/**
      - tests/**
      - .github/workflows/build-singbox-rules.yml
  pull_request:
    paths:
      - selfdirect.list
      - special.list
      - scripts/**
      - tests/**
      - .github/workflows/build-singbox-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SING_BOX_VERSION: 1.13.21
      SING_BOX_SHA256: 24f9ef8e7234e13e71e74c3598a4164c5fe07b7b67ccc6e96cf68b54789f72cd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Queued main builds use the current branch, including prior bot commits.
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}

      - name: Install pinned sing-box
        shell: bash
        run: |
          set -euo pipefail
          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 "$base/$archive" -o "$archive"
          echo "$SING_BOX_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive"
          mkdir -p "$RUNNER_TEMP/sing-box-bin"
          cp "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" "$RUNNER_TEMP/sing-box-bin/"
          echo "$RUNNER_TEMP/sing-box-bin" >> "$GITHUB_PATH"

      - name: Test converter and binary round trips
        run: python3 -m unittest discover -s tests -v

      - name: Generate and compile both rule sets
        run: python3 scripts/build_rules.py

      - name: Upload generated rules
        uses: actions/upload-artifact@v4
        with:
          name: platform-rules
          path: rules/
          if-no-files-found: error

      - name: Publish generated files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules selfdirect.json selfdirect.srs selfClashDirect.list
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "build: update platform rule sets"
          git push origin HEAD:main
